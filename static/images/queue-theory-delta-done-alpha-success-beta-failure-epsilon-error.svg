<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 256 800 142" width="800" height="142" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">ε = β / δ</title>
  <desc id="d">The error ratio ε is the failure rate β divided by the done rate δ.</desc>
  <rect y="256" width="800" height="142" fill="#ffffff"/>

  <!-- ε = β / δ -->
  <text x="70" y="337" text-anchor="middle" font-size="72" font-weight="700" fill="#334155">ε</text>
  <text x="135" y="332" text-anchor="middle" font-size="56" font-weight="600" fill="#334155">=</text>
  <text x="250" y="304" text-anchor="middle" font-size="56" font-weight="700" fill="#b91c1c">β</text>
  <line x1="200" y1="318" x2="300" y2="318" stroke="#334155" stroke-width="5"/>
  <text x="250" y="374" text-anchor="middle" font-size="56" font-weight="700" fill="#0369a1">δ</text>
  <path d="M680 270 V258 H760 V270" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <rect x="440" y="280" width="240" height="60" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <rect x="680" y="280" width="80" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="560" y="324" text-anchor="middle" font-size="44" font-weight="700" fill="#15803d">α</text>
  <text x="720" y="324" text-anchor="middle" font-size="44" font-weight="700" fill="#b91c1c">β</text>
  <path d="M440 355 V367 H760 V355" fill="none" stroke="#0369a1" stroke-width="3"/>
  <text x="600" y="397" text-anchor="middle" font-size="30" font-weight="700" fill="#0369a1">δ</text>
</svg>
