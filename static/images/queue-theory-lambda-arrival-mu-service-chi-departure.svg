<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 88 800 254" width="800" height="254" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">λ → μ → χ</title>
  <desc id="d">Items flow into the system at arrival rate λ, are served at service rate μ, and flow out at departure rate χ.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect y="88" width="800" height="254" fill="#ffffff"/>

  <!-- input -->
  <text x="150" y="168" text-anchor="middle" font-size="96" font-weight="700" fill="#0f766e">λ</text>
  <line x1="20" y1="215" x2="276" y2="215" stroke="#334155" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- system -->
  <rect x="290" y="90" width="220" height="250" rx="16" fill="#f1f5f9" stroke="#334155" stroke-width="3"/>

  <text x="400" y="238" text-anchor="middle" font-size="96" font-weight="700" fill="#1d4ed8">μ</text>

  <!-- output -->
  <text x="650" y="168" text-anchor="middle" font-size="96" font-weight="700" fill="#b45309">χ</text>
  <line x1="524" y1="215" x2="776" y2="215" stroke="#334155" stroke-width="8" marker-end="url(#arrow)"/>
</svg>
