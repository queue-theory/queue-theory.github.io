<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">α, β, σ, δ</title>
  <desc id="d">Items leave the system as successes at rate α, failures at rate β, or skips at rate σ. Done δ is α plus β, and together δ plus σ equals throughput χ.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <line x1="12" y1="200" x2="103" y2="200" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="110" y="150" width="280" height="100" rx="16" fill="#f1f5f9" stroke="#334155" stroke-width="3"/>
  <text x="250" y="215" text-anchor="middle" font-size="40" font-weight="600" fill="#334155">χ = α + β + σ</text>
  <path d="M390 200 H440 V70 H553" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M390 200 H553" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M440 200 V330 H553" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="620" y="103" text-anchor="middle" font-size="96" font-weight="700" fill="#15803d">α</text>
  <text x="620" y="233" text-anchor="middle" font-size="96" font-weight="700" fill="#b91c1c">β</text>
  <text x="620" y="363" text-anchor="middle" font-size="96" font-weight="700" fill="#6d28d9">σ</text>
  <path d="M683 42 H695 V265 H683" fill="none" stroke="#0369a1" stroke-width="3"/>
  <line x1="695" y1="153" x2="708" y2="153" stroke="#0369a1" stroke-width="3"/>
  <text x="752" y="186" text-anchor="middle" font-size="96" font-weight="700" fill="#0369a1">δ</text>
</svg>
